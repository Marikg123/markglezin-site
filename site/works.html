    </div>

    <button class="lightbox-next" aria-label="Next">&#8250;</button>
  </div>

  <!-- Gallery data (auto-generated by build.py) -->
  <script src="gallery.js"></script>

  <script>
(function () {
  const data      = window.GALLERY || { categories: [], paintings: [] };
  const gallery   = document.getElementById('gallery');
  const workSub   = document.getElementById('work-sub');
  const mobileWS  = document.getElementById('mobile-work-sub');
  const paintings = data.paintings || [];
  const categories = data.categories || [];

  // ── Slug helpers ──────────────────────────────────────────────────────────
  function toSlug(cat) { return cat.toLowerCase().replace(/\s+/g, '-'); }
  function fromSlug(slug) {
    return categories.find(c => toSlug(c) === slug) || categories[0];
  }

  // ── Build sidebar sub-links ───────────────────────────────────────────────
  categories.forEach(cat => {
    const slug = toSlug(cat);
    [workSub, mobileWS].forEach(el => {
      if (!el) return;
      const a = document.createElement('a');
      a.href = '#' + slug;
      a.textContent = cat;
      a.dataset.cat = cat;
      el.appendChild(a);
    });
  });

  // ── Gallery rendering ─────────────────────────────────────────────────────
  // 3 equal-width columns, masonry-style (no wasted vertical space).
  // Images are distributed round-robin: 1→col1, 2→col2, 3→col3, 4→col1 …
  const NUM_COLS = 3;

  function buildItems(list) {
    gallery.innerHTML = '';

    // Remove any previous preload links
    document.querySelectorAll('link[data-gallery-preload]').forEach(l => l.remove());

    if (!list.length) { initLightboxClicks(); return; }

    // Preload first 6 thumbnails (2 rows) for instant display
    list.slice(0, 6).forEach(p => {
      const link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = p.thumb || p.file;
      link.setAttribute('data-gallery-preload', '');
      document.head.appendChild(link);
    });

    // Create column containers
    const cols = [];
    for (let c = 0; c < NUM_COLS; c++) {
      const col = document.createElement('div');
      col.className = 'gallery-col';
      gallery.appendChild(col);
      cols.push(col);
    }

    // Distribute images round-robin across columns
    list.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.dataset.title = p.title + (p.sold ? ' — Sold' : '');
      item.dataset.idx   = i;   // visual order for lightbox navigation
      item.dataset.full  = p.file;  // full-size for lightbox

      const img = document.createElement('img');
      img.src      = p.thumb || p.file;  // use thumbnail in grid
      img.alt      = p.title;
      img.width    = p.tw || p.w;
      img.height   = p.th || p.h;
      img.loading  = i < 9 ? 'eager' : 'lazy';
      img.decoding = 'async';
      if (i < 3) img.fetchPriority = 'high';

      item.appendChild(img);
      cols[i % NUM_COLS].appendChild(item);
    });
    initLightboxClicks();
  }

  // ── Filter ────────────────────────────────────────────────────────────────
  function setFilter(cat) {
    // Update sub-link active states
    document.querySelectorAll('#work-sub a, #mobile-work-sub a').forEach(a => {
      a.classList.toggle('active', a.dataset.cat === cat);
    });
    buildItems(cat ? paintings.filter(p => p.category === cat) : paintings);
  }

  function applyHash() {
    const slug = window.location.hash.slice(1);
    const cat  = slug ? fromSlug(slug) : (categories[0] || null);
    setFilter(cat);
  }

  // React to hash changes (sidebar link clicks — no page reload)
  window.addEventListener('hashchange', applyHash);

  // Initial render
  applyHash();

  // ── Lightbox ─────────────────────────────────────────────────────────────
  const lightbox  = document.getElementById('lightbox');
  const lbImgA    = document.getElementById('lb-img-a');
  const lbImgB    = document.getElementById('lb-img-b');
  const lbCaption = document.getElementById('lb-caption');
  const lbSpinner = document.getElementById('lb-spinner');
  let items = [], idx = 0;
  let transitioning = false;
  const FADE_MS     = 300;   // matches CSS transition duration
  const SPINNER_DELAY = 400; // show spinner only if load takes > 400ms

  // activeImg is the currently visible slot; inactiveImg is the hidden one
  let activeImg   = lbImgA;
  let inactiveImg = lbImgB;

  function openLightbox(list, i) {
    items = list; idx = i;
    showSlide(false);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  // Preload into browser cache via off-screen Image object
  function loadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload  = () => resolve(src);
      img.onerror = () => resolve(src);
      img.src = src;
    });
  }

  // Preload neighbours so they're cache-warm before the user navigates
  function preloadAdjacent() {
    if (items.length < 2) return;
    [-1, 1].forEach(d => {
      const src = items[(idx + d + items.length) % items.length].dataset.full
                  || items[(idx + d + items.length) % items.length].querySelector('img').src;
      new Image().src = src;
    });
  }

  function showSlide(animate) {
    const it      = items[idx];
    const src     = it.dataset.full || it.querySelector('img').src;
    const caption = it.dataset.title || '';

    if (!animate) {
      // First open — set both slots to same src so no size jump on first nav
      lbImgA.src = lbImgB.src = src;
      lbImgA.alt = lbImgB.alt = caption;
      lbImgA.classList.add('lb-active');
      lbImgB.classList.remove('lb-active');
      activeImg   = lbImgA;
      inactiveImg = lbImgB;
      lbCaption.textContent = caption;
      preloadAdjacent();
      return;
    }

    // ── Cross-fade transition ──────────────────────────────────────────────
    // Strategy: load new image into the hidden slot, then swap visibility
    // simultaneously — the old image stays sharp until the new one is ready.
    transitioning = true;

    let spinnerTimer = setTimeout(() => lbSpinner.classList.add('visible'), SPINNER_DELAY);

    // Start loading into the inactive slot right away
    inactiveImg.src = src;
    inactiveImg.alt = caption;

    // Wait for image to be in cache, then decode so it's paint-ready
    loadImage(src)
      .then(() => inactiveImg.decode ? inactiveImg.decode().catch(() => {}) : Promise.resolve())
      .then(() => {
        clearTimeout(spinnerTimer);
        lbSpinner.classList.remove('visible');

        // Swap captions (fade out → update → fade in)
        lbCaption.style.opacity = '0';

        // Cross-fade the two image slots simultaneously
        activeImg.classList.remove('lb-active');
        inactiveImg.classList.add('lb-active');

        // Swap roles for next navigation
        [activeImg, inactiveImg] = [inactiveImg, activeImg];

        // Fade caption back in with new text
        requestAnimationFrame(() => {
          lbCaption.textContent = caption;
          lbCaption.style.opacity = '';
        });

        // Unlock after transition completes
        setTimeout(() => {
          transitioning = false;
          preloadAdjacent();
        }, FADE_MS);
      });
  }

  function closeLightbox() {
    transitioning = false;
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    lbSpinner.classList.remove('visible');
    lbCaption.style.opacity = '';
    setTimeout(() => {
      if (!lightbox.classList.contains('open')) {
        lbImgA.src = lbImgB.src = '';
      }
    }, 300);
  }

  function navigate(dir) {
    if (transitioning) return;         // block rapid clicks
    idx = (idx + dir + items.length) % items.length;
    showSlide(true);
  }

  function initLightboxClicks() {
    // Sort by data-idx so lightbox arrows follow visual (row) order,
    // not DOM (column) order.
    const list = Array.from(gallery.querySelectorAll('.gallery-item'))
                      .sort((a, b) => a.dataset.idx - b.dataset.idx);
    list.forEach((el, i) => el.addEventListener('click', () => openLightbox(list, i)));
  }

  lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
  lightbox.querySelector('.lightbox-prev').addEventListener('click', () => navigate(-1));
  lightbox.querySelector('.lightbox-next').addEventListener('click', () => navigate(1));
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  // ── Touch swipe for mobile ────────────────────────────────────────────────
  let touchStartX = 0, touchStartY = 0, swiping = false;
  const SWIPE_THRESHOLD = 40;

  lightbox.addEventListener('touchstart', e => {
    if (!lightbox.classList.contains('open')) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    swiping = true;
  }, { passive: true });

  lightbox.addEventListener('touchmove', e => {
    if (!swiping) return;
    // Prevent vertical scroll inside lightbox
    const dx = Math.abs(e.touches[0].clientX - touchStartX);
    const dy = Math.abs(e.touches[0].clientY - touchStartY);
    if (dx > dy) e.preventDefault();
  }, { passive: false });

  lightbox.addEventListener('touchend', e => {
    if (!swiping) return;
    swiping = false;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    // Only register horizontal swipes (not vertical scrolls or taps)
    if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > dy) {
      if (dx < 0) navigate(1);   // swipe left → next
      else        navigate(-1);  // swipe right → prev
    }
  }, { passive: true });

})();
  </script>

  <script src="js/main.js"></script>
